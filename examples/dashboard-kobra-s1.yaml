# Muster-Dashboard fuer die Anycubic HA Integration
#
# Getestet mit einer Anycubic Kobra S1 Combo (eine ACE Pro, vier Slots).
#
# WICHTIG - Kamera:
#   Die Kameraflaeche zeigt NICHT den Anycubic-Cloudstream. Der laeuft ueber
#   Agora-RTC und laesst sich nicht als Home-Assistant-camera-Entity abbilden;
#   er ist nur im mitgelieferten Anycubic-Panel verfuegbar.
#   Hier wird eine EXTERNE Kamera eingebunden, im Originalaufbau eine
#   SONOFF CAM-S1. Jede Kamera mit einer camera.*-Entity funktioniert.
#   Platzhalter unten: camera.drucker_kamera
#
# Voraussetzungen:
#   - HACS-Card "button-card" (custom:button-card)
#   - Eine camera.*-Entity fuer die Kameraflaeche
#   - Optional: drei Template-Helfer fuer die Kameraeinblendung
#       sensor.kobra_overlay_uhrzeit, sensor.kobra_overlay_datum,
#       sensor.kobra_overlay_druckinfo
#   - Optional: zwei input_number-Helfer fuer die Temperatur-Feinjustierung
#       input_number.kobra_duse_temperatur_offset,
#       input_number.kobra_bett_temperatur_offset
#
# Entity-IDs anpassen:
#   Die IDs enthalten den Druckernamen, hier "anycubic_kobra_s1". Heisst dein
#   Drucker anders, passe sie vor dem Einfuegen an - am schnellsten per
#   Suchen-und-Ersetzen von "anycubic_kobra_s1" auf deinen Namen.
#
# Einfuegen:
#   Dashboard -> Stift -> Drei-Punkte-Menue -> "Raw-Konfigurationseditor"
#   und diesen Block unter "views:" einhaengen.

title: Anycubic Kobra S1
path: anycubic-kobra-s1
icon: mdi:printer-3d-nozzle
type: sections
max_columns: 4
sections:
- type: grid
  cards:
  - type: custom:button-card
    name: kamera
    icon: mdi:cctv
    show_state: false
    styles:
      card:
      - background: '#050510'
      - border-radius: 12px
      - padding: 10px 16px
      - border-bottom: 2px solid "#00d4ff"
      - box-shadow: '0 0 12px #00d4ff44'
      name:
      - font-family: monospace
      - font-size: 13px
      - letter-spacing: 2px
      - color: '#00d4ff'
      - text-transform: lowercase
      icon:
      - color: '#00d4ff'
      - width: 18px
    tap_action:
      action: none
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
      - condition: state
        entity: light.anycubic_kobra_s1_camera_light
        state: 'on'
      card:
        type: picture-elements
        camera_image: camera.drucker_kamera
        camera_view: live
        elements:
        - type: state-label
          entity: sensor.kobra_overlay_datum
          style:
            top: 3%
            left: 3%
            transform: none
            font-size: 11px
            color: white
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
        - type: state-label
          entity: sensor.kobra_overlay_uhrzeit
          style:
            top: 3%
            right: 3%
            left: auto
            transform: none
            font-size: 12px
            font-weight: bold
            color: white
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
        - type: state-label
          entity: sensor.kobra_overlay_druckinfo
          style:
            top: 1%
            left: 50%
            transform: translate(-50%, 0)
            font-size: 11px
            font-weight: bold
            color: white
            background: rgba(0,0,0,0.55)
            padding: 3px 10px
            border-radius: 6px
            border: 1px solid rgba(255,255,255,0.25)
            white-space: nowrap
        - type: state-label
          entity: sensor.anycubic_kobra_s1_nozzle_temperature
          prefix: 'Düse '
          style:
            bottom: 12%
            top: auto
            right: 3%
            left: auto
            transform: none
            font-size: 11px
            color: '#e67e22'
            font-weight: bold
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
        - type: state-label
          entity: sensor.anycubic_kobra_s1_hotbed_temperature
          prefix: 'Bett '
          style:
            bottom: 4%
            top: auto
            right: 3%
            left: auto
            transform: none
            font-size: 11px
            color: '#e67e22'
            font-weight: bold
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
    - type: conditional
      conditions:
      - condition: state
        entity: light.anycubic_kobra_s1_camera_light
        state_not: 'on'
      card:
        type: picture-elements
        image: /local/anycubic.png
        elements:
        - type: state-label
          entity: sensor.kobra_overlay_datum
          style:
            top: 3%
            left: 3%
            transform: none
            font-size: 11px
            color: white
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
        - type: state-label
          entity: sensor.kobra_overlay_uhrzeit
          style:
            top: 3%
            right: 3%
            left: auto
            transform: none
            font-size: 12px
            font-weight: bold
            color: white
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
        - type: state-label
          entity: sensor.kobra_overlay_druckinfo
          style:
            top: 1%
            left: 50%
            transform: translate(-50%, 0)
            font-size: 11px
            font-weight: bold
            color: white
            background: rgba(0,0,0,0.55)
            padding: 3px 10px
            border-radius: 6px
            border: 1px solid rgba(255,255,255,0.25)
            white-space: nowrap
        - type: state-label
          entity: sensor.anycubic_kobra_s1_nozzle_temperature
          prefix: 'Düse '
          style:
            bottom: 12%
            top: auto
            right: 3%
            left: auto
            transform: none
            font-size: 11px
            color: '#e67e22'
            font-weight: bold
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
        - type: state-label
          entity: sensor.anycubic_kobra_s1_hotbed_temperature
          prefix: 'Bett '
          style:
            bottom: 4%
            top: auto
            right: 3%
            left: auto
            transform: none
            font-size: 11px
            color: '#e67e22'
            font-weight: bold
            text-shadow: 0 1px 2px rgba(0,0,0,0.9)
            white-space: nowrap
  - type: custom:button-card
    entity: light.anycubic_kobra_s1_camera_light
    name: Kamera-Licht
    icon: mdi:lightbulb-on
    show_state: true
    tap_action:
      action: toggle
