        - border-radius: 12px
        - padding: 14px
        name:
        - color: '#888'
        - font-size: 11px
        - text-transform: uppercase
        - letter-spacing: 1px
        state:
        - font-size: 20px
        - color: '#fff'
        - font-weight: 700
        icon:
        - color: '#4fc3f7'
        - width: 24px
- type: grid
  cards:
