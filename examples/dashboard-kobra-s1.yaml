      card:
      - background: '[[[ return entity.state === ''on'' ? ''#2d2500'' : ''#2c2c2e'' ]]]'
      - border-radius: 12px
      - padding: 14px
      - border: '[[[ return entity.state === ''on'' ? ''1px solid #f1c40f'' : ''1px solid #444'' ]]]'
      name:
      - color: '#888'
      - font-size: 11px
      - text-transform: uppercase
      - letter-spacing: 1px
      state:
      - font-size: 18px
      - color: '[[[ return entity.state === ''on'' ? ''#f1c40f'' : ''#aaa'' ]]]'
      - font-weight: 700
      - text-transform: uppercase
      icon:
      - color: '[[[ return entity.state === ''on'' ? ''#f1c40f'' : ''#555'' ]]]'
      - width: 24px
      label:
      - color: '#aaa'
      - font-size: 11px
      - font-style: italic
      - margin-top: 2px
    show_label: true
    label: Auto-Aus nach 90 s
    grid_options:
      columns: 6
      rows: auto
  - type: custom:button-card
    entity: sensor.anycubic_kobra_s1_ace_active_filament
    name: Aktives Filament
    icon: mdi:printer-3d-nozzle
    show_state: true
    tap_action:
