      - background: '#2c2c2e'
      - border-radius: 12px
      - padding: 14px
      - border: '1px solid #444'
      name:
      - color: '#888'
      - font-size: 11px
      - text-transform: uppercase
      - letter-spacing: 1px
      state:
      - font-size: 16px
      - color: '#fff'
      - font-weight: 700
      icon:
      - color: '[[[ var e = states[''sensor.anycubic_kobra_s1_ace_active_filament'']; if (!e || e.state === ''unavailable'' || e.state === ''unknown'') return ''#555''; var a = e.attributes || {}; return a.color_hex || ''#555''; ]]]'
      - width: 24px
      label:
      - color: '#aaa'
      - font-size: 11px
      - font-style: italic
      - margin-top: 2px
    state_display: '[[[ var e = states[''sensor.anycubic_kobra_s1_ace_active_filament'']; if (!e || e.state === ''unavailable'' || e.state === ''unknown'') return ''—''; var a = e.attributes || {}; if (a.local_slot === undefined || a.local_slot === null) return e.state; var c = a.color_hex || ''#888''; var dot = ''<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'' + c + '';border:2px solid rgba(255,255,255,0.6);box-shadow:0 0 0 1px rgba(0,0,0,0.5);vertical-align:-3px;margin-left:5px;"></span>''; return ''Slot '' + a.local_slot + '' · '' + (a.material_type || ''-'') + dot; ]]]'
    grid_options:
      columns: 6
      rows: auto
    show_label: true
    label: '[[[ var e = states[''sensor.anycubic_kobra_s1_ace_active_filament'']; if (!e || e.state === ''unavailable'' || e.state === ''unknown'') return ''noch kein Wechsel erfasst''; var d = new Date(e.last_changed); return ''aktiv seit '' + d.toLocaleTimeString(''de-DE'', {hour: ''2-digit'', minute: ''2-digit''}); ]]]'
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    custom_fields:
      fortschritt: '[[[ var v = states[''sensor.anycubic_kobra_s1_job_progress''].state; return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><ha-icon icon="mdi:progress-check" style="color:#27ae60;--mdc-icon-size:22px;"></ha-icon><div style="color:#888;font-size:10px;text-transform:uppercase;letter-spacing:1px;">Fortschritt</div><div style="color:#27ae60;font-size:20px;font-weight:700;">${v}%</div></div>`; ]]]'
      verstrichen: '[[[ var fn = function(r){ if(r===''unknown''||r===''unavailable''||r===''None'')return ''—''; var m=parseInt(r); if(isNaN(m))return ''—''; var d=Math.floor(m/1440); var h=Math.floor((m%1440)/60); var mi=m%60; if(d>0)return d+''d ''+h+''h ''+mi+''m''; if(h>0)return h+''h ''+mi+''m''; return mi+''m''; }; var v = fn(states[''sensor.anycubic_kobra_s1_job_time_elapsed''].state); return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><ha-icon icon="mdi:timer" style="color:#4fc3f7;--mdc-icon-size:22px;"></ha-icon><div style="color:#888;font-size:10px;text-transform:uppercase;letter-spacing:1px;">Verstrichen</div><div style="color:#fff;font-size:18px;font-weight:700;">${v}</div></div>`; ]]]'
      restzeit: '[[[ var fn = function(r){ if(r===''unknown''||r===''unavailable''||r===''None'')return ''—''; var m=parseInt(r); if(isNaN(m))return ''—''; var d=Math.floor(m/1440); var h=Math.floor((m%1440)/60); var mi=m%60; if(d>0)return d+''d ''+h+''h ''+mi+''m''; if(h>0)return h+''h ''+mi+''m''; return mi+''m''; }; var v = fn(states[''sensor.anycubic_kobra_s1_job_time_remaining''].state); return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><ha-icon icon="mdi:timer-sand" style="color:#f1c40f;--mdc-icon-size:22px;"></ha-icon><div style="color:#888;font-size:10px;text-transform:uppercase;letter-spacing:1px;">Restzeit</div><div style="color:#fff;font-size:18px;font-weight:700;">${v}</div></div>`; ]]]'
    styles:
      card:
      - background: '#2c2c2e'
      - border-radius: 12px
      - padding: 14px
      grid:
      - grid-template-areas: '"fortschritt verstrichen restzeit"'
      - grid-template-columns: 1fr 1fr 1fr
      - gap: 12px
  - type: custom:button-card
    name: lüfter
    icon: mdi:fan
